services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfiled
        container_name: api-mini-chat
        volumes:
            - .:/var/www
        depends_on:
            - db
    nginx:
        image: nginx:alpine
        container_name: web-server-mini-chat
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
    db:
        image: mysql:latest
        container_name: mini-chat-db
        restart: on-failure
        ports:
            - "3306:3306"
        volumes:
            - mini-chat-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: mini-chat
volumes:
    mini-chat-data:
