services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: api-mini-chat
        ports:
            - ${REVERB_SERVER_PORT:-8080}:8080
        user: "${UID}:${GID}"
        env_file:
            - .env
        volumes:
            - .:/var/www
        networks:
            - chat-network
        depends_on:
            db:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: web-server-mini-chat
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - chat-network
        depends_on:
            - app
    db:
        image: mysql:latest
        container_name: mini-chat-db
        restart: on-failure
        ports:
            - "3306:3306"
        volumes:
            - mini-chat-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: mini-chat'
        networks:
            - chat-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    mini-chat-data:

networks:
    chat-network:
        driver: bridge
